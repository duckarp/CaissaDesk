name: Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            exe: CaissaDesk
            archive: CaissaDesk-linux-x64.tar.gz
          - os: windows-latest
            rid: win-x64
            exe: CaissaDesk.exe
            archive: CaissaDesk-win-x64.zip

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Tag v1.2.3 -> Version 1.2.3 (shown in the app header). Manual runs get a CI pre-release version.
      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "Version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test CaissaDesk.slnx --configuration Release -p:Version=${{ steps.version.outputs.version }}

      - name: Publish ${{ matrix.rid }}
        run: |
          dotnet publish CaissaDesk/CaissaDesk.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ steps.version.outputs.version }} \
            -o ./publish-${{ matrix.rid }}
          test -f "./publish-${{ matrix.rid }}/${{ matrix.exe }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.archive }}" -C "./publish-${{ matrix.rid }}" "${{ matrix.exe }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "./publish-${{ matrix.rid }}/${{ matrix.exe }}" -DestinationPath "${{ matrix.archive }}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum CaissaDesk-linux-x64.tar.gz CaissaDesk-win-x64.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CaissaDesk-linux-x64.tar.gz
            dist/CaissaDesk-win-x64.zip
            dist/SHA256SUMS
          generate_release_notes: true
