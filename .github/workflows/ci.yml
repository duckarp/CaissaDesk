name: CI Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CaissaDesk.slnx

      - name: Build solution
        run: dotnet build CaissaDesk.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test CaissaDesk.slnx --configuration Release --no-build --verbosity normal
