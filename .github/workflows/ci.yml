name: CI Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and Test
        run: |
          if ! dotnet test --configuration Release --logger "console;verbosity=detailed" > test.log 2>&1; then
            cat test.log
            ERR=$(grep -E "(FAILED|Failed|Error|Exception)" test.log | head -n 5 | tr '\r\n' ' | ')
            echo "::error title=BuildTestFailed::$ERR"
            exit 1
          fi
          cat test.log
